<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moments On Time CRM</title><link rel="icon" href=""><link rel="stylesheet" href="../styles.css">
<style>
body{background:#f4f3f0}.crm{min-height:100vh}.crmbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}.crmbrand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--green)}.crmbrand img{width:48px;height:48px;object-fit:contain;border-radius:50%}.crm-login-logo{width:82px!important;height:82px!important;display:block;margin:0 auto 12px;object-fit:contain;border-radius:12px}.image-unavailable{visibility:hidden}.crm-layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 72px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px}.sidebtn{width:100%;text-align:left;border:0;background:transparent;padding:12px 13px;border-radius:10px;cursor:pointer;color:#555;margin-bottom:5px;font-weight:600}.sidebtn.active,.sidebtn:hover{background:#f2ede9;color:var(--purple)}.main{padding:28px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.stat b{display:block;font-size:30px;color:var(--purple);margin-top:6px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{color:#716b65}.small{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions-sm{display:flex;gap:7px}.btn-sm{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}.btn-danger{color:#a33}.image-editor{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0 16px}.image-editor img{width:130px;height:100px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#faf9f6;padding:6px}.drop{border:1.5px dashed #cfc8bf;border-radius:14px;padding:18px;text-align:center;background:#faf9f6}.thumb{width:74px;height:54px;object-fit:cover;border-radius:9px;background:#eee}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.loginbox img{width:82px;display:block;margin:0 auto 12px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:0;background:#f4f1ed;padding:9px 12px;border-radius:9px;cursor:pointer}.tab.active{background:var(--purple);color:#fff}.notice{padding:12px 14px;border-radius:10px;background:#fff4df;color:#725522;margin-bottom:15px;font-size:13px}.success{background:#e8f6ee;color:#235c3e}.inquiry-tools{display:flex;gap:14px;align-items:center;padding:14px}.search-wrap{position:relative;flex:1}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:22px;color:#8a837b;pointer-events:none}.search-input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 42px;background:#faf9f6;outline:none}.search-input:focus,.filter-select:focus{border-color:#9b7b9d;box-shadow:0 0 0 3px rgba(115,62,117,.08)}.filter-wrap{display:flex;align-items:center;gap:8px}.filter-wrap label{font-size:12px;color:var(--muted);font-weight:700}.filter-select{height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 34px 0 12px;outline:none}.results-count{font-size:12px;color:var(--muted);font-weight:700}.date-main{white-space:nowrap}.message-preview{display:block;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5f5952}.status-select{appearance:none;border:0;border-radius:999px;padding:8px 30px 8px 11px;font-weight:800;font-size:12px;cursor:pointer;outline:none;background-position:right 10px center}.status-new{background:#fff0d6;color:#9a6417}.status-contacted{background:#e8efff;color:#3e5f9e}.status-completed{background:#e4f5eb;color:#28734a}.status-cancelled{background:#fbe7e8;color:#a23f47}.status-select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}.btn-view{color:var(--purple);font-weight:800;background:#f5eef6}.btn-view:hover{background:#eaddea}.empty-state{padding:30px;text-align:center;display:flex;flex-direction:column;gap:5px;color:var(--muted)}.empty-state strong{color:#4b4540}.modal-backdrop{position:fixed;inset:0;background:rgba(26,20,25,.56);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:22px;z-index:100}.modal-backdrop.open{display:flex}.modal-card{width:min(720px,100%);max-height:min(86vh,760px);overflow:auto;background:#fff;border:1px solid rgba(255,255,255,.4);border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.inquiry-modal{padding:24px}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid var(--line)}.modal-head h3{margin:4px 0 0;font-size:24px}.modal-close{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:24px;line-height:1;cursor:pointer;color:#5f5952}.inquiry-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:20px 0}.detail-item{background:#fff;padding:14px}.detail-item span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}.detail-item strong{font-size:14px;color:#3f3a36;overflow-wrap:anywhere}.detail-id{font-family:monospace;font-size:11px!important}.detail-message{border:1px solid var(--line);background:#faf9f6;border-radius:14px;padding:16px}.detail-message>span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.detail-message p{margin:9px 0 0;white-space:pre-wrap;line-height:1.65;color:#423d38}.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;line-height:1}.status-badge:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}@media(max-width:700px){.inquiry-tools{flex-direction:column;align-items:stretch}.filter-wrap{justify-content:space-between}.filter-select{flex:1}.inquiry-detail-grid{grid-template-columns:1fr}.inquiry-table .message-preview{max-width:160px}.modal-backdrop{padding:12px}.inquiry-modal{padding:18px}}@media(max-width:900px){.crm-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:5px}.sidebtn{min-width:max-content}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.main{padding:16px}.stats{grid-template-columns:1fr}.crmbar{padding:0 14px}}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="crm.js"></script>
</body></html>
